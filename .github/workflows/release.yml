name: Release

on:
  push:
    tags: ['v*']

# Nothing gets write access by default; the build job asks for what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish the GitHub release
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be
      # moved); Dependabot keeps them current (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install NSIS and zip
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > plugin/cloudsync/version.txt
          sed -i "s/!define PLUGIN_VERSION \".*\"/!define PLUGIN_VERSION \"$VERSION\"/" installer/cloudsync-installer.nsi

      - name: Build Windows installer
        run: |
          cp -r plugin/cloudsync installer/cloudsync
          cd installer && makensis cloudsync-installer.nsi
          mv CloudSync-Setup-*.exe "$GITHUB_WORKSPACE/"

      - name: Build portable zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/openlp-cloudsync-portable
          cp installer/Install.bat installer/Install-CloudSync.ps1 installer/install.sh dist/openlp-cloudsync-portable/
          cp -r plugin/cloudsync dist/openlp-cloudsync-portable/
          cd dist && zip -qr "../openlp-cloudsync-portable-$VERSION.zip" openlp-cloudsync-portable

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            CloudSync-Setup-*.exe
            openlp-cloudsync-portable-*.zip
          generate_release_notes: true
